[project]
name = "doodle-bot"
version = "0.1.0"
description = "Turn an SO-101 arm into a pen-plotting doodle robot"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pyserial>=3.5", "pyyaml>=6.0", "pillow>=10.0"]

[project.scripts]
doodle = "doodle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doodle"]

[tool.setuptools.package-data]
doodle = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name = "photo-to-line-art"
model_profiles = "../models.toml"

[executors.local]
kind = "local"

# Switch a stage to `executor = "gpu-worker"` to offload it. Authentication
# stays in the remote machine's environment, never in this file.
# [executors.gpu-worker]
# kind = "http"
# url = "https://gpu-worker.example.internal"
# token_env = "DOODLEBOT_GPU_WORKER_TOKEN"
# timeout_seconds = 180

[[stages]]
id = "scene"
type = "image.scene_caricature"
model_profile = "scene_v1"
enabled = true
executor = "local"
options = { theme = "Fourth of July celebration" }

[[stages]]
id = "line-art"
type = "image.line_art"
model_profile = "line_art_v1"
enabled = true
executor = "local"

[[stages]]
id = "svg"
type = "vector.svg"
model_profile = "vector_svg_v1"
enabled = true
executor = "local"

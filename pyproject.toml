[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doodle-bot"
version = "0.1.0"
description = "Extensible photo-to-caricature-to-line-art pipeline"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.scripts]
doodle-bot = "doodle_bot.cli:main"

[project.entry-points."doodle_bot.stages"]
# Third-party packages can register a Stage subclass here.

[tool.hatch.build.targets.wheel]
packages = ["src/doodle_bot"]
